name: ci

on:
  push:
    # changeset-release/** is here on purpose. The version pull request is opened by the
    # changesets bot with GITHUB_TOKEN, and GitHub deliberately does not trigger
    # pull_request workflows for it — so #48 merged on 2026-09-05 with NO checks reported
    # at all, and so did the releases before it. Running CI on the BRANCH restores the
    # coverage without a personal access token or an app.
    branches: [main, 'changeset-release/**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pin gate (G6)
        run: pnpm pin-gate
      - name: docs gate (G2) — every export documented
        run: node scripts/docs-gate.mjs
      - name: typecheck
        run: pnpm typecheck
      - name: tests with coverage floor (G5)
        run: pnpm test
      - name: build
        run: pnpm build
      - name: inventory is generated, never typed (ui-standard §4)
        run: |
          node scripts/inventory.mjs
          if ! git diff --quiet -- docs/inventory.md; then
            echo "inventory: docs/inventory.md is stale — run 'node scripts/inventory.mjs' and commit."
            git --no-pager diff -- docs/inventory.md
            exit 1
          fi
          echo "inventory: current."
      - name: changeset gate (G1) — src changes must carry a changeset
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -q '^\.changeset/.*\.md$'; then
            echo "G1: src/ changed without a changeset — run 'pnpm changeset'."
            exit 1
          fi
          echo "G1: ok."
      - name: standard-sync gate (G7) — a rule and its enforcer travel together
        # The escape hatch is deliberate and NAMED: correcting the standard's own prose
        # (a stale roster, a wrong gate number) touches no component, and a gate with no
        # honest way out gets disabled instead of respected. The label makes the exception
        # visible in the PR list rather than silent in a commit message.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'standard-only')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The philosophy's keystone was honour-system until now: ui-standard.md claimed
          # "a rule change and the component enforcing it land in the same PR" while no gate
          # ever read the file. A rule nobody enforces is a wish. Docs-only PRs (README,
          # inventory, migrations) are exempt — only the STANDARD binds to src/.
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          standard=$(echo "$changed" | grep -c '^docs/ui-standard\.md$' || true)
          src=$(echo "$changed" | grep -c '^src/' || true)
          if [ "$standard" -gt 0 ] && [ "$src" -eq 0 ]; then
            echo "G7: docs/ui-standard.md changed with no src/ change — a rule with no enforcer."
            echo "     If the rule is already enforced, say WHICH component in the PR body and add"
            echo "     the label 'standard-only' to override."
            exit 1
          fi
          echo "G7: ok."

  visual:
    runs-on: ubuntu-latest
    # The SAME container that generates baselines (scripts/update-visual.sh) — one
    # rendering environment everywhere, or fonts alone drift 1-2% of pixels.
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: pnpm via corepack (the image's node)
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: visual gate (G4) — light + dark + RTL per demo
        run: pnpm exec playwright test
      - name: upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
