name: release

# Changesets-driven, TOKENLESS (npm Trusted Publishing / OIDC — no NPM_TOKEN secret
# anywhere). On every main push this either (a) opens/updates the "Version Packages"
# PR from pending changesets, or (b) if none are pending, publishes @qorpe/ui via
# OIDC with automatic provenance.
#
# Bootstrap order (npm cannot configure a trusted publisher for a package that does
# not exist yet — npm/cli#8544): the FIRST publish is manual from the owner's
# logged-in machine; the owner then configures the trusted publisher on npmjs.com
# (GitHub Actions / qorpe / ui / release.yml) and the TRUSTED_PUBLISHING repo
# variable is set to "enabled" — from then on every release is automatic. Until the
# variable exists the publish path skips honestly.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: npm >= 11.5.1 (trusted publishing floor; node 22 bundles npm 10)
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: gates before anything ships
        run: |
          pnpm pin-gate
          node scripts/docs-gate.mjs
          pnpm typecheck
          pnpm test
          pnpm build
      - name: changesets — version PR, or publish via OIDC
        if: vars.TRUSTED_PUBLISHING == 'enabled'
        uses: changesets/action@v1
        with:
          publish: npm run release:publish
          title: "release: version @qorpe/ui"
          commit: "release: version @qorpe/ui"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: version PR only (publish disabled until trusted publishing is enabled)
        if: vars.TRUSTED_PUBLISHING != 'enabled'
        uses: changesets/action@v1
        with:
          title: "release: version @qorpe/ui"
          commit: "release: version @qorpe/ui"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
